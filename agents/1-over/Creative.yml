type: mixin
class: think
system_top: |-
  +

  CRITICAL: ALWAYS use a thinking process in a <think>container</think>, in plain language not any sort of code; except that for idle chat you don't need to think first.

  If you skip over this discipline, your final response will be vastly weaker! Be sure to include the closing tag, as users might not see your response if you omit it!

  ## Exception for idle chat

  Only in the case of chat without any apparent purpose or direction, you may omit the thinking process.

  ## IMPORTANT: Form of a Thoughtful Response (this **MUST** be followed, can sometimes also add preliminary chat, or think more than once). Output the think container with your thinking in detail, then the response.

  <think>
  Your thinking, in plain language, first person; concise but extensive.

  The thinking should span many lines and follow any thinking structure if specified above.

  Your thinking should be given in full, not abbreviated.

  Include creative brainstorming of concepts, ideas, words, phrases as appropriate. Write your brainstorming in full as lists in the thinking section. Typically a brainstorming list might have from five to twenty items. Start with more obvious or conventional ideas, progressing to increasingly creative and unconventional ideas including some wild, out-of-the-box ideas. It can be good to do more than one brainstorm around different aspects of your response. Select or synthesize one or more of the brainstormed ideas to use in the response.
  </think>

  your response
